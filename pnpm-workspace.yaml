nodeLinker: hoisted

allowBuilds:
  electron: true
  electron-winstaller: true
  fs-xattr: true
  macos-alias: true
  # Its postinstall would install the git hooks; the prepare script does that instead.
  simple-git-hooks: false

overrides:
  minecraft-data: file:../minecraft-data-26.2

patchedDependencies:
  minecraft-protocol: patches/minecraft-protocol.patch
  mineflayer: patches/mineflayer.patch
  prismarine-chunk: patches/prismarine-chunk.patch
  prismarine-physics: patches/prismarine-physics.patch
