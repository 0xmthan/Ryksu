name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      vulnerabilities: ${{ steps.audit-data.outputs.vulnerabilities }}
      artifact-url: ${{ steps.audit-upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - name: Check dependencies for high and critical vulnerabilities
        id: audit
        run: pnpm audit --audit-level high --json > audit.json
      - name: Collect audit results
        id: audit-data
        if: always()
        run: node scripts/ci/report.cjs audit
      - name: Save full package audit
        id: audit-upload
        if: always() && steps.audit-data.outputs.vulnerabilities != ''
        uses: actions/upload-artifact@v7
        with:
          name: package-audit
          path: audit.json
          retention-days: 30

  checks:
    name: Tests and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release-version: ${{ steps.release.outputs.version }}
      install: ${{ steps.install.outcome }}
      types: ${{ steps.types.outcome }}
      lint: ${{ steps.lint.outcome }}
      tests: ${{ steps.tests.outcome }}
    defaults:
      run:
        working-directory: ryksu
    steps:
      - uses: actions/checkout@v6
        with:
          path: ryksu
      # Recreate the sibling file dependency in pnpm-workspace.yaml.
      # Wrapper release 3.117.0; remove these extra checkouts when the
      # upstream npm package supports 26.2 and the override is removed.
      - name: Fetch Minecraft data wrapper
        uses: actions/checkout@v6
        with:
          repository: PrismarineJS/node-minecraft-data
          ref: 94b717a14e167afdbcdfe708f40f7eed8917fe08
          path: minecraft-data-26.2
      # Temporary data from PrismarineJS/minecraft-data PR #1333.
      - name: Fetch Minecraft 26.2 data
        uses: actions/checkout@v6
        with:
          repository: PrismarineJS/minecraft-data
          ref: 4005723728fe00435209ebdd2234e9fb1184a184
          path: minecraft-data-26.2/minecraft-data
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ryksu/package.json
      - name: Generate Minecraft data entry point
        run: node ../minecraft-data-26.2/bin/generate_data.js
      - name: Install exact locked dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Detect release version
        id: release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/ci/release-version.cjs
      - name: Type check
        id: types
        run: pnpm typecheck
      - name: Lint
        id: lint
        run: pnpm lint
      - name: Run tests
        id: tests
        run: pnpm test

  release:
    name: Release ZIP
    needs: checks
    if: github.event_name == 'push' && needs.checks.outputs.release-version != ''
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    defaults:
      run:
        working-directory: ryksu
    steps:
      - uses: actions/checkout@v6
        with:
          path: ryksu
      # Recreate the sibling file dependency in pnpm-workspace.yaml.
      # Wrapper release 3.117.0; remove these extra checkouts when the
      # upstream npm package supports 26.2 and the override is removed.
      - name: Fetch Minecraft data wrapper
        uses: actions/checkout@v6
        with:
          repository: PrismarineJS/node-minecraft-data
          ref: 94b717a14e167afdbcdfe708f40f7eed8917fe08
          path: minecraft-data-26.2
      # Temporary data from PrismarineJS/minecraft-data PR #1333.
      - name: Fetch Minecraft 26.2 data
        uses: actions/checkout@v6
        with:
          repository: PrismarineJS/minecraft-data
          ref: 4005723728fe00435209ebdd2234e9fb1184a184
          path: minecraft-data-26.2/minecraft-data
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ryksu/package.json
      - name: Generate Minecraft data entry point
        run: node ../minecraft-data-26.2/bin/generate_data.js
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Set build version from commit prefix
        env:
          RELEASE_VERSION: ${{ needs.checks.outputs.release-version }}
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.version = process.env.RELEASE_VERSION
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          JS
      - name: Build release ZIP
        run: pnpm make
      - name: Upload release ZIP
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: Ryksu-v${{ needs.checks.outputs.release-version }}-macOS
          path: ryksu/out/make/**/*.zip
          if-no-files-found: error
          retention-days: 30

  report:
    name: CI report
    needs: [packages, checks, release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Load package audit details
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: package-audit
          path: audit-report
      - name: Write run summary
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/ci/report.cjs summary
